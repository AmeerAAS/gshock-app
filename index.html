<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SHOCK Skeleton Mechanical Hybrid</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --bezel-color: #1a1d24;
            --bezel-accent: #2c313d;
            --text-gold: #e5b94c;
            --text-red: #ff3b30;
            --lcd-bg: #8ba888;
            --lcd-text: #142115;
            --glass-shine: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .watch-container {
            position: relative;
            width: 440px;
            height: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* G-SHOCK Outer Bezel (Octagonal / Rough Hex Shape) */
        .outer-bezel {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2a2e39 0%, #15171e 100%);
            border-radius: 42%;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 4px 6px rgba(255,255,255,0.1),
                inset 0 -6px 10px rgba(0,0,0,0.9);
            border: 4px solid #363b47;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bezel-screws {
            position: absolute;
            width: 90%;
            height: 90%;
            pointer-events: none;
        }

        .screw {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #777, #222);
            border-radius: 50%;
            border: 1px solid #444;
        }

        .screw::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 2px;
            width: 8px;
            height: 2px;
            background: #111;
        }

        .screw.top-left { top: 12%; left: 12%; transform: rotate(25deg); }
